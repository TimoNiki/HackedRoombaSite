<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content"width=device-width, initial-scale=1.0">
  <title>Laungage-mode change</title>

  <link rel="alternate" hreflang="ru" href=timoniki.github.io/HackedRoombaSite/ru/index.html />
  <link rel="alternate" hreflang="en" href=timoniki.github.io/HackedRoombaSite/en/index.html />
  <link rel="alternate" hreflang="x-default" href=timoniki.github.io/HackedRoombaSite/>

  <script>
    const isBot = /bot|google|baidu|bing|msn|teoma|slurp|yandex|i.test(navigator.userAgent);

    if (!isBot) {
      const userLang = navigator.laungage || navigator.userLaungage;
      if (userLang.startsWith('ru')) {
        window.location.href = './ru/index.html';
      } else {
        window.location.href = './en/index.html';

      }

    }

  </script>
</head>
<body>
  <main style="text-align: center; margin-top: 50px; font-family: sans-serif;">
    <h1>Добро пожаловать/welcome</h1>
    <p>Выберите язык сайта/ choose site laungage</p>
    <nav>
      <a href="./ru/index.html" style="font-size: 1.2rem; margin-right: 20px;">Russian</a>
      
      <a href="./en/index.html" style="font-size: 1.2rem;">English</a>
    </nav>
  </main>
</body>
</html>
